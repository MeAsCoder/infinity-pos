<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1a0a10" />
    <title>Infinity Liquor &amp; Lounge — POS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Playfair Display"', 'ui-serif', 'Georgia', 'serif'],
            },
            colors: {
              brand: { DEFAULT: '#7a1230', dark: '#4d0a1e', light: '#9c1d40', 50: '#fdf2f5' },
              gold: { 400: '#e8c874', 500: '#c9a227', 600: '#a9841c' },
              ink: { 950: '#0d0b0d', 900: '#161318', 800: '#211d24', 700: '#2f2a33', 600: '#453e49' },
            },
            boxShadow: {
              soft: '0 1px 2px rgba(20,10,15,0.04), 0 4px 16px rgba(20,10,15,0.06)',
              card: '0 1px 3px rgba(20,10,15,0.06), 0 8px 24px rgba(20,10,15,0.08)',
              popover: '0 12px 40px rgba(10,5,8,0.25)',
            },
          },
        },
      };
    </script>
    <style>
      html, body, #root { height: 100%; }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #d8d2d5; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #c2b9bd; }
      :focus-visible { outline: 2px solid #c9a227; outline-offset: 1px; }
    </style>
  </head>
  <body class="bg-neutral-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
