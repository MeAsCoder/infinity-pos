<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1a0a10" />
    <title>Infinity Liquor &amp; Lounge — POS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- iOS Safari ignores manifest.webmanifest icons/behavior — these three
         lines are what actually make "Add to Home Screen" work well on iPhone -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Infinity POS" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CDN removed — it isn't covered by the service worker's
         precache, so it silently breaks styling on an offline repeat visit.
         Tailwind now compiles into src/index.css at build time instead (see
         tailwind.config.js / postcss.config.js below); that CSS file already
         gets swept up by workbox's globPatterns. -->

    <style>
      html, body, #root { height: 100%; }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #d8d2d5; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #c2b9bd; }
      :focus-visible { outline: 2px solid #c9a227; outline-offset: 1px; }
    </style>
  </head>
  <body class="bg-neutral-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
